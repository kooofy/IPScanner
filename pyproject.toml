# IPScanner 项目元数据 + 工具配置
#
# 说明：本项目是 PyInstaller 打包的桌面应用，不是一个可 pip 安装的库，
# 因此这里**没有** [build-system]，也不提供 wheel。`pip install .` 不适用；
# 依赖安装请用 requirements.txt / requirements-dev.txt。
# 本文件的作用是：① 集中声明项目元数据（版本、描述、Python 版本下限）；
# ② 给静态检查工具（ruff）提供配置，避免散落 .flake8 / setup.cfg。
#
# 版本号唯一来源约定：本文件的 version 必须与 cli.py 的 __version__ 一致，
# 由 tests/test_scaffolding.py::VersionSyncTest 强制校验。

[project]
name = "ipscanner"
version = "1.7.4"
description = "局域网终端扫描与资产识别工具（PyQt5 GUI + 无头 CLI）"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "kooofy" }]
keywords = ["network", "scanner", "lan", "asset-discovery", "snmp", "wmi", "mdns"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
]

# 与 requirements.txt 保持一致（那边是安装入口，这里是元数据声明）
dependencies = [
    "PyQt5==5.15.11",
    # PyQt5-Qt5 必须按平台分流（PyPI 上没有任何一个版本覆盖三平台），
    # 理由与平台差异详见 requirements.txt 里同一处的注释。
    "PyQt5-Qt5==5.15.2; sys_platform == \"win32\"",
    "PyQt5-Qt5>=5.15.11; sys_platform != \"win32\"",
    "PyQt5_sip==12.18.0",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = [
    "pyinstaller==6.21.0",
    "pyinstaller-hooks-contrib==2026.6",
    "ruff==0.16.8",
]

[project.urls]
Homepage = "https://github.com/kooofy/IPScanner"
Repository = "https://github.com/kooofy/IPScanner"
Issues = "https://github.com/kooofy/IPScanner/issues"

# ── ruff ─────────────────────────────────────────────────────────────
# 只开"正确性"规则，不开格式类规则：目标是拦住真实缺陷（未定义名 →
# 运行期 NameError、未使用导入/变量 → 死代码），而不是制造大面积风格 diff。
# 历史背景：本项目曾因此类规则发现 ui_dialogs.py 里 QGraphicsRectItem
# 未导入（任何含交换机的拓扑图都会 NameError）。
[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["venv", "build", "dist", "dist_new"]

[tool.ruff.lint]
select = [
    "F",    # Pyflakes：未定义名 / 未使用导入 / 未使用变量 / 重复定义等
    "E9",   # 语法与运行期错误（E9xx 子集）
]
# 不设 per-file-ignores：当前全仓库在该规则集下零告警，任何新增告警都应
# 就地修掉，而不是放宽规则。
