name: CI

# 触发条件：向 main 推送、针对 main 的 PR、以及手动触发。
# 手动触发用于「发版前跑一遍完整流程（含 PyInstaller 打包验证）」。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的连续推送只保留最新一次，避免排队堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 测试 (Windows · Python ${{ matrix.python-version }})
    runs-on: windows-latest
    # fail-fast: false —— 需要看到全部版本的失败情况，而不是第一个失败就取消其余
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # 无显示环境：PyQt5 仅 import、不创建真实窗口，必须走 offscreen 平台插件
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 静态检查 (ruff)
        # 规则集见 pyproject.toml [tool.ruff.lint]，只开 F / E9 正确性规则。
        # 这类规则拦的是真实缺陷：未定义名（运行期 NameError）、未使用导入/变量。
        run: python -m ruff check .

      - name: 单元测试
        run: python run_tests.py

      - name: CLI 冒烟测试
        # 无头模式是本项目的对外自动化接口，必须保证「装完就能跑」：
        # 覆盖参数解析、引擎扫描、JSON 输出三条链路。
        # --no-mdns：CI 里不做组播发现，避免依赖网络环境导致慢/不稳定。
        run: |
          python cli.py --version
          python cli.py scan -r 127.0.0.1/32 --no-ports --no-mdns --format json
          python cli.py history --list --format json

  test-cross-platform:
    name: 跨平台测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 存在的理由：代码里 ping / ports / network_tool_mixin / app_paths 到处是
    # platform.system() 分支，而 CI 此前只在 Windows 上跑 —— 这些分支**从未被
    # 自动化验证过**。本 job 只跑最新一个解释器版本：目的是覆盖**平台分支**，
    # 解释器版本覆盖交给上面的 Windows 全矩阵，避免把 job 数乘到 12 个。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装 Linux 图形依赖
        # offscreen 平台插件不需要 X server，但仍会动态链接 libGL / libEGL /
        # libxkbcommon / fontconfig —— GitHub 的 ubuntu 镜像不带这些，缺了会
        # 直接 "Could not load the Qt platform plugin"。
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 静态检查 (ruff)
        run: python -m ruff check .

      - name: 单元测试
        run: python run_tests.py

      - name: CLI 冒烟测试
        # 与 Windows 侧同三条链路：参数解析、引擎扫描、JSON 输出。
        run: |
          python cli.py --version
          python cli.py scan -r 127.0.0.1/32 --no-ports --no-mdns --format json
          python cli.py history --list --format json

  build:
    name: 打包验证 (PyInstaller)
    runs-on: windows-latest
    # PR 上不打包：耗时长且与代码正确性无关，只在合入 main / 手动触发时验证
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 构建 GUI 版（onedir）
        # spec 名固定为 IPScanner.spec，产物名由 version.py 决定 —— 不再需要
        # 「按 mtime 猜当前该构建哪个 spec」那种脆弱逻辑。
        run: pyinstaller --noconfirm IPScanner.spec

      - name: 构建 CLI 版（onefile）
        # CLI 刻意保持单文件：便于计划任务 / SSH / 容器里直接拷一个 exe 就用。
        run: pyinstaller --noconfirm IPScanner_cli.spec

      - name: 验证 GUI 产物完整
        # onedir 产物必须同时有 exe 与 _internal/。只断言 exe 存在是不够的 ——
        # 「依赖没被 COLLECT 进去」这种问题只有检查 _internal 才能发现。
        # assets\styles\*.qss 由 styles.py 在 import 期读取，读不到会直接抛错；
        # 断言到具体文件（而不是 assets 目录）才能发现"目录在、文件没进去"。
        run: |
          $ver = python -c "import version; print(version.__version__)"
          $dir = "dist\IPScanner_$ver"
          foreach ($p in @("$dir\IPScanner_$ver.exe", "$dir\_internal",
                           "$dir\_internal\i18n", "$dir\_internal\oui.db",
                           "$dir\_internal\assets\styles\light.qss",
                           "$dir\_internal\assets\styles\dark.qss")) {
            if (-not (Test-Path $p)) { throw "GUI 产物缺失: $p" }
          }
          Write-Host "GUI 产物 OK: $dir"

      - name: 验证 CLI 产物可独立执行
        # 打包后的 exe 不依赖源码目录，这一步能真实暴露「模块没被收进去」
        run: |
          .\dist\IPScanner_cli.exe --version
          .\dist\IPScanner_cli.exe scan -r 127.0.0.1/32 --no-ports --no-mdns --format json

  # ── 质量门禁（v1.9 1.4）──────────────────────────────────────────
  # 三个门禁各自独立成一个 job：红了要能一眼看出是**哪一个**红的，
  # 否则"允许红"会慢慢变成"习惯性忽略红"。
  # 取舍与实测基线见 docs/ROADMAP_V1.9.md §1.4。

  quality-coverage:
    name: 覆盖率门禁（per-file 下界）
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 单元测试（带覆盖率）
        run: python -m coverage run run_tests.py

      - name: 覆盖率总览（只出报告，**不**设门槛）
        # 全局数字不进门槛：它会被与本次改动无关的 0% 文件稀释
        # （main.py / oui_updater.py / parse_ieee_oui.py 现在都是 0%），
        # 改动过程中必然往下掉 → 假红 → 人去调低门槛。
        run: python -m coverage report

      - name: per-file 下界（真正的门禁）
        # 下界 = 2026-10-11 **实测值**，不是拍的：
        #   history_store.py  95%（365 statements / 缺 20）
        #   db_util.py        90%（83 statements / 缺 8）
        # 规则：这两个数**不许变低**。要放宽必须在提交信息里写明理由 ——
        # 否则"下界"就变成了"每次掉下去就调一下"的橡皮筋。
        # coverage 只有一个全局 fail_under，做不到 per-file —— 所以逐文件各跑一次。
        # ⚠ 匹配不到文件时 coverage 以**退出码 1** 失败（不是静默通过），
        #    因此改文件名 / 打错字会当场红，不会悄悄失去门禁。
        # v1.9 1.1（资产表）新增"要碰的文件"时，在这里**加一行**并登记当时的实测值。
        run: |
          python -m coverage report --include="history_store.py" --fail-under=95
          python -m coverage report --include="db_util.py" --fail-under=90

  quality-types:
    name: 类型门禁（pyright）
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pyright（范围见 pyproject.toml 的 [tool.pyright]）
        # 检查范围是**包含清单**，不是排除清单：只钉本次改动要碰的文件，现状 0 error。
        # 全领域层开到 0 error 要清 70 条，其中 22 条还是 cred_store.py 里
        # 「布尔标志守卫条件导入」造成的**假阳性** —— 那样做是给 1.1 拖时间，
        # 不是给它兜底。好处是：不需要维护一份会随 pyright 版本漂移的"已知错误基线"。
        # ⚠ 版本锁在 requirements-dev.txt（pyright==1.1.414）：新版会新增规则，
        #    让以前干净的文件莫名变红。升级要当成一次有意的变更来做。
        run: python -m pyright

# ⚠ 依赖审计（pip-audit）**不在这个文件里**，见 .github/workflows/dependency-audit.yml。
# 它是唯一要联网的门禁，而它审的东西不会随提交变化 —— 挂在每次 push 上
# 只会得到一个会随机红的门禁。
